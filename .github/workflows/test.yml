name: Test

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
  workflow_dispatch:
    inputs:
      cli-ref:
        description: uSync.CommandLine branch, tag or commit to build the tool from
        required: false
        default: ''

permissions:
  contents: read

env:
  # Build uSync.Cli from source until a release with files-verify is on nuget.org.
  CLI_REPO: Jumoo/uSync.CommandLine
  CLI_REF: ${{ inputs.cli-ref || 'v17/main' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: actionlint
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color

      - name: action.yml and verify/action.yml match
        run: |
          if ! cmp -s action.yml verify/action.yml; then
            echo "::error file=action.yml::action.yml and verify/action.yml differ. Edit one and copy it over the other."
            diff action.yml verify/action.yml
            exit 1
          fi

  pack:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.pack.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ env.CLI_REPO }}
          ref: ${{ env.CLI_REF }}

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - id: pack
        env:
          SUFFIX: ci.${{ github.run_number }}
        run: |
          dotnet pack uSync/uSync.csproj -c Release -o "$RUNNER_TEMP/feed" --version-suffix "$SUFFIX"
          pkg="$(ls "$RUNNER_TEMP"/feed/uSync.Cli.*.nupkg | head -n 1)"
          version="$(basename "$pkg" .nupkg)"
          echo "version=${version#uSync.Cli.}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: feed
          path: ${{ runner.temp }}/feed

  actions:
    needs: pack
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.pack.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: feed
          path: .local-feed

      # --- every fixture, straight through the CLI (same script you run locally) ---
      - name: test/run-local.ps1
        shell: pwsh
        run: ./test/run-local.ps1 -Feed .local-feed -Version $env:VERSION

      # --- setup ---
      - id: setup
        uses: ./setup
        with:
          version: ${{ env.VERSION }}
          source: .local-feed

      - name: setup put the tool on PATH and set its outputs
        shell: bash
        env:
          CLI: ${{ steps.setup.outputs.command }}
          INSTALLED: ${{ steps.setup.outputs.version }}
        run: |
          set -eux
          [ "$INSTALLED" = "$VERSION" ]
          "$CLI" --version
          name="$(basename "$CLI")"
          command -v "$name"

      # --- verify: a clean folder passes ---
      - uses: ./verify
        with:
          working-directory: test/fixtures/clean
          version: ${{ env.VERSION }}
          source: ${{ github.workspace }}/.local-feed
          sarif: true
          upload-sarif: false

      - name: clean fixture wrote a SARIF file
        shell: bash
        run: test -s test/fixtures/clean/usync.sarif

      # --- verify: broken folders fail with exit 1 ---
      - id: alias-clash
        uses: ./verify
        continue-on-error: true
        with:
          working-directory: test/fixtures/alias-clash
          version: ${{ env.VERSION }}
          source: ${{ github.workspace }}/.local-feed

      - id: conflict-markers
        uses: ./
        continue-on-error: true
        with:
          working-directory: test/fixtures/conflict-markers
          version: ${{ env.VERSION }}
          source: ${{ github.workspace }}/.local-feed

      # --- verify: content is opt-in ---
      - id: content-skipped
        uses: ./verify
        with:
          working-directory: test/fixtures/content-conflict
          version: ${{ env.VERSION }}
          source: ${{ github.workspace }}/.local-feed

      - id: content-checked
        uses: ./verify
        continue-on-error: true
        with:
          working-directory: test/fixtures/content-conflict
          content: true
          version: ${{ env.VERSION }}
          source: ${{ github.workspace }}/.local-feed

      # --- verify: the tool failing is exit 2 ---
      - id: missing-folder
        uses: ./verify
        continue-on-error: true
        with:
          folder: does-not-exist
          version: ${{ env.VERSION }}
          source: ${{ github.workspace }}/.local-feed

      - name: broken fixtures failed the way they should
        shell: bash
        env:
          ALIAS: ${{ steps.alias-clash.outcome }}/${{ steps.alias-clash.outputs.exit-code }}
          MARKERS: ${{ steps.conflict-markers.outcome }}/${{ steps.conflict-markers.outputs.exit-code }}
          SKIPPED: ${{ steps.content-skipped.outcome }}/${{ steps.content-skipped.outputs.exit-code }}
          CHECKED: ${{ steps.content-checked.outcome }}/${{ steps.content-checked.outputs.exit-code }}
          MISSING: ${{ steps.missing-folder.outcome }}/${{ steps.missing-folder.outputs.exit-code }}
        run: |
          fail=0
          check() {
            if [ "$2" = "$3" ]; then echo "PASS $1: $2"; else echo "::error::$1: expected $3, got $2"; fail=1; fi
          }
          check alias-clash      "$ALIAS"   failure/1
          check conflict-markers "$MARKERS" failure/1
          check content-skipped  "$SKIPPED" success/0
          check content-checked  "$CHECKED" failure/1
          check missing-folder   "$MISSING" failure/2
          exit "$fail"

      # --- run: arguments and env vars reach the tool ---
      - id: run
        uses: ./run
        with:
          command: --version
          server: https://example.invalid
          version: ${{ env.VERSION }}
          source: ${{ github.workspace }}/.local-feed

      - name: run passed the exit code through
        shell: bash
        env:
          CODE: ${{ steps.run.outputs.exit-code }}
        run: '[ "$CODE" = "0" ]'
