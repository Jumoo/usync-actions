# Build, check, deploy to an Azure Web App, then import uSync on the live site.
#
# Needs:
#   vars.SITE_URL                 https://my-site.azurewebsites.net
#   vars.AZURE_WEBAPP_NAME        my-site
#   secrets.AZURE_PUBLISH_PROFILE the web app's publish profile
#   secrets.USYNC_CLIENT_ID / USYNC_CLIENT_SECRET  an Umbraco API user (see the README)
name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7

      - name: Publish
        run: dotnet publish src/MySite -c Release -o ./publish

      # The usual checks, plus: did the uSync folder make it into the publish output?
      - uses: Jumoo/usync-actions/verify@v1
        with:
          working-directory: src/MySite
          publish-folder: ${{ github.workspace }}/publish

      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_PUBLISH_PROFILE }}
          package: ./publish

      # Wait for the site to restart. Fails after 5 minutes if it never answers.
      - uses: Jumoo/usync-actions/run@v1
        with:
          command: usync-ping
          args: --timeout 300
          server: ${{ vars.SITE_URL }}
          client-id: ${{ secrets.USYNC_CLIENT_ID }}
          client-secret: ${{ secrets.USYNC_CLIENT_SECRET }}

      # Optional: show what the import will change in the job summary first.
      - uses: Jumoo/usync-actions/run@v1
        with:
          command: usync-report
          server: ${{ vars.SITE_URL }}
          client-id: ${{ secrets.USYNC_CLIENT_ID }}
          client-secret: ${{ secrets.USYNC_CLIENT_SECRET }}

      - uses: Jumoo/usync-actions/run@v1
        with:
          command: usync-import
          server: ${{ vars.SITE_URL }}
          client-id: ${{ secrets.USYNC_CLIENT_ID }}
          client-secret: ${{ secrets.USYNC_CLIENT_SECRET }}
